  #   environment:
  #     DATABASE_URL: postgres://armut:armut_dev_password@postgres:5432/armut
  #     SIMPLEFIN_TOKEN: ${SIMPLEFIN_TOKEN}
  #     PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
